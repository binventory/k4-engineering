<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="description" content="Interaktives Messespiel als Beispiel: 3D-Modelle, Quiz und Augmented Reality für Ihren Messestand. K4-Engineering.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a2219">
<title>Arbeitstag – interaktives Messespiel (Beispiel) | K4-Engineering</title>
<style>
:root{
  --bg1:#0a2219; --bg2:#10372a; --bg3:#1b5a42;
  --cream:#f7f2e6; --paper:#fffaf0; --ink:#12231a; --ink2:#3a4f44; --muted:#9bb3a6;
  --orange:#ff7a1a; --orange-d:#e86600; --yellow:#ffc83d; --green:#2fbf71; --green-d:#1f9a58; --red:#e5484d;
  --line:rgba(255,255,255,.16); --glass:rgba(255,255,255,.07);
  --r:18px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  color:var(--cream);
  background:
    radial-gradient(1100px 620px at 78% -8%,var(--bg3),transparent 62%),
    linear-gradient(180deg,var(--bg2),var(--bg1));
  background-attachment:fixed;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
a{color:var(--yellow)}
h1,h2,h3,p{margin:0}
#app{min-height:100%;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;width:100%;max-width:1080px;margin:0 auto;
  padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
.screen.active{display:flex;animation:fadein .35s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* top bar + legal bar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0 10px}
.brand{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.brand b{color:var(--orange)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:8px 4px}
.legalbar{margin-top:auto;padding:18px 0 4px;text-align:center;font-size:.74rem;line-height:1.5;color:var(--muted)}
.legalbar button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:inherit;padding:2px 4px}

/* start */
.hero{padding:6px 0 4px;text-align:center}
.eyebrow{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);font-weight:800}
h1{font-size:clamp(2.6rem,11vw,4.6rem);line-height:.95;font-weight:900;letter-spacing:-.02em;margin:8px 0 10px;
  background:linear-gradient(180deg,#fff,#d8efe1);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(1rem,3.8vw,1.2rem);color:#d6e6dc;max-width:34ch;margin:0 auto}
.chips{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:16px 0 4px;padding:0}
.chips li{font-size:.78rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:#cfe3d7}
.jobs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0 8px}
@media (min-width:700px){.jobs{grid-template-columns:repeat(3,1fr);gap:16px}}
.job{position:relative;text-align:left;border:1px solid var(--line);border-radius:22px;padding:14px 14px 16px;min-height:168px;
  background:linear-gradient(165deg,rgba(255,255,255,.12),rgba(255,255,255,.04));display:flex;flex-direction:column;gap:6px;
  transition:transform .15s ease,border-color .15s ease,background .15s ease}
.job:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.34)}
.job:active{transform:scale(.98)}
.job .ico{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.1);display:grid;place-items:center;margin-bottom:4px}
.job .ico svg{width:42px;height:42px}
.job h3{font-size:1.12rem;font-weight:800}
.job p{font-size:.82rem;color:#c3d9cc;line-height:1.35}
.pill{position:absolute;top:12px;right:12px;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:999px}
.pill.play{background:var(--orange);color:#1a1208}
.pill.prev{border:1px solid var(--line);color:#cfe3d7;background:rgba(0,0,0,.18)}
.job.playable{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange),0 12px 34px rgba(255,122,26,.22);
  background:linear-gradient(165deg,rgba(255,122,26,.22),rgba(255,255,255,.05))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 26px;border-radius:16px;border:0;
  font-weight:900;font-size:1.05rem;letter-spacing:.01em;background:var(--orange);color:#1a1208;box-shadow:0 8px 0 var(--orange-d),0 14px 26px rgba(0,0,0,.28);
  transition:transform .12s ease,box-shadow .12s ease}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 var(--orange-d),0 6px 14px rgba(0,0,0,.28)}
.btn.ghost{background:transparent;color:var(--cream);border:2px solid var(--line);box-shadow:none}
.btn.ghost:active{transform:scale(.98)}
.btn.block{width:100%}
.iconbtn{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;font-size:1.3rem}

/* intro */
.intro{display:grid;gap:18px;align-items:center;margin:auto 0;padding:6px 0}
@media (min-width:860px){.intro{grid-template-columns:1.1fr 1fr;gap:34px}}
.intro .art{border-radius:26px;overflow:hidden;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.35);aspect-ratio:4/3;background:#9fd6c0}
.intro .art svg{display:block;width:100%;height:100%}
.intro h2{font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.08;font-weight:900;margin:6px 0 10px}
.intro p{color:#d6e6dc;line-height:1.5;margin-bottom:12px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px;padding:0;list-style:none}
.facts li{font-size:.8rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass)}
.warn{font-size:.82rem;color:#ffd9b8;background:rgba(255,122,26,.12);border:1px solid rgba(255,122,26,.4);border-radius:14px;padding:10px 12px}

/* play */
.hud{display:flex;align-items:center;gap:12px;padding:2px 0 10px}
.hud-title{flex:1;min-width:0}
.hud-title b{display:block;font-size:1rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-title small{display:block;color:var(--muted);font-size:.78rem}
.shield{width:36%;max-width:170px}
.shield span{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:5px;font-weight:700}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--green),#7be3a6);border-radius:99px;transition:width .5s ease,background .3s ease}
.playgrid{display:grid;gap:12px;flex:1;align-content:start}
@media (min-width:860px) and (orientation:landscape){.playgrid{grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}}
@media (orientation:landscape) and (max-height:560px){
  .screen{padding-top:8px;padding-bottom:8px}
  .hud{padding-bottom:6px}
  .playgrid{grid-template-columns:calc((100vh - 84px) * 1.3333) minmax(0,1fr);gap:14px;align-items:start}
  .stage{border-radius:18px}
  .side{gap:8px}
  .panel{padding:10px 12px}
  .hz-text{margin:4px 0 6px;min-height:0;font-size:.92rem}
  .timer{margin-bottom:8px}
  .choices{gap:7px}
  .choice{min-height:46px;padding:4px 12px;font-size:.95rem}
  .choice .ci{width:34px;height:34px}
  .slot{padding:5px 2px 4px}
  .intro{grid-template-columns:1fr 1fr;gap:18px}
  .intro .art{max-height:calc(100vh - 90px)}
}
@media (max-width:360px){.screen{padding-left:12px;padding-right:12px}.btn{padding:0 18px}.hud-title b{font-size:.92rem}.slot small{font-size:.54rem}}
@media (orientation:landscape) and (max-height:560px) and (max-width:760px){.slot small{display:none}.slot{padding:8px 2px}}
.stage{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.35);aspect-ratio:4/3;background:#9fd6c0}
.stage svg{display:block;width:100%;height:100%}
.stage.shake{animation:shake .45s ease}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0}
.flash.bad{background:radial-gradient(circle at 50% 50%,rgba(229,72,77,0) 30%,rgba(229,72,77,.65));animation:flash .7s ease}
.flash.good{background:radial-gradient(circle at 50% 50%,rgba(47,191,113,0) 40%,rgba(47,191,113,.5));animation:flash .7s ease}
@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.callout{position:absolute;left:50%;top:10px;transform:translate(-50%,-14px) scale(.8);opacity:0;pointer-events:none;
  background:var(--red);color:#fff;font-weight:900;letter-spacing:.06em;padding:8px 18px;border-radius:12px;font-size:1.05rem;
  box-shadow:0 8px 20px rgba(0,0,0,.3);transition:transform .22s cubic-bezier(.2,1.4,.4,1),opacity .2s ease;white-space:nowrap}
.callout.on{opacity:1;transform:translate(-50%,0) scale(1)}
.callout.ok{background:var(--green-d)}
.side{display:grid;gap:12px;min-width:0}
.playgrid>*,.panel,.choices,.choice,.choice .cl,.hz-title span{min-width:0}
.choice .cl,.hz-title span,.fc-name{overflow-wrap:anywhere;-webkit-hyphens:auto;hyphens:auto}
.tray{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.slot{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px 6px;border-radius:14px;border:1.5px dashed rgba(255,255,255,.28);color:#7f9a8c;text-align:center;transition:all .3s ease}
.slot .ico{width:34px;height:34px;display:grid;place-items:center}
.slot svg{width:26px;height:26px}
.slot small{font-size:.6rem;line-height:1.1;font-weight:700;letter-spacing:0;max-width:100%}
.slot.on{border-style:solid;border-color:var(--green);background:rgba(47,191,113,.16);color:#c9f5da;transform:translateY(-3px)}
.slot.miss{border-color:rgba(229,72,77,.5);color:#e8a3a5}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.05));border:1px solid var(--line);border-radius:22px;padding:14px}
.hz-title{font-size:1.25rem;font-weight:900;display:flex;align-items:center;gap:10px}
.hz-title i{font-style:normal;background:var(--red);color:#fff;border-radius:9px;padding:2px 8px;font-size:.8rem;letter-spacing:.06em}
.hz-text{color:#d6e6dc;margin:6px 0 10px;line-height:1.45;min-height:2.9em}
.timer{height:7px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:12px}
.timer i{display:block;height:100%;width:100%;background:var(--yellow);transform-origin:left;transform:scaleX(1)}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;min-height:62px;padding:8px 14px;border-radius:16px;border:3px solid transparent;
  background:var(--paper);color:var(--ink);font-weight:800;font-size:1.02rem;box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .1s ease,background .2s ease,border-color .2s ease}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.choice .ci{width:40px;height:40px;border-radius:12px;background:#e9f0e4;display:grid;place-items:center;flex:none;color:var(--ink2)}
.choice svg{width:26px;height:26px}
.choice.right{background:#e3f8ec;border-color:var(--green)}
.choice.wrong{background:#fde8e8;border-color:var(--red)}
.choice[disabled]{cursor:default;opacity:.92}
.choice[disabled]:not(.right):not(.wrong){opacity:.55}

/* feature pop-up (centre of the screen) */
.sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));
  pointer-events:none;opacity:0;visibility:hidden;transition:opacity .22s ease,visibility 0s linear .22s}
.sheet.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .22s ease}
.sheet .in{width:100%;max-width:600px;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow:auto;background:var(--paper);color:var(--ink);
  border-radius:24px;padding:16px 16px 14px;box-shadow:0 30px 80px rgba(0,0,0,.5);border-top:7px solid var(--green);
  transform:translateY(16px) scale(.94);transition:transform .34s cubic-bezier(.2,1.3,.4,1)}
.sheet.on .in{transform:none}
.sheet.bad .in{border-top-color:var(--red)}
.fc-head{font-size:1.25rem;font-weight:900;display:flex;align-items:center;gap:10px;margin-bottom:10px;line-height:1.2}
.fc-head .mark{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--green-d);font-size:1.05rem}
.sheet.bad .fc-head .mark{background:var(--red)}
.fc-body{display:grid;gap:12px}
@media (min-width:540px){.fc-body{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center}}
.fc-art{border-radius:16px;overflow:hidden;border:1px solid #dfe8e2;aspect-ratio:5/4;background:#eef4f0}
.fc-art svg{display:block;width:100%;height:100%}
.fc-eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#c2410c}
.sheet.bad .fc-eyebrow{color:#b42318}
.fc-name{font-size:1.22rem;font-weight:900;line-height:1.2;margin:4px 0 6px;color:var(--ink)}
.fc-text{color:var(--ink2);line-height:1.45;font-size:.95rem}
.fc-extra{margin-top:8px;font-size:.84rem;font-weight:700;color:#14412c;background:#e3f0e8;border-radius:12px;padding:7px 10px}
.fc-extra[hidden]{display:none}
.sheet .btn{margin-top:14px}
.sheet .note{font-size:.7rem;color:#6a7f73;margin-top:10px;line-height:1.4}
.fc-art .halo,.fc-art .inset{display:none}
.fc-art .halo{fill:none;stroke:#ffa600;stroke-width:2.4;stroke-linejoin:round;animation:halo 1.1s ease-in-out infinite}
.fc-art[data-hot="ear"] [data-k="ear"],.fc-art[data-hot="visor"] [data-k="visor"],.fc-art[data-hot="susp"] [data-k="susp"],
.fc-art[data-hot="shell"] [data-k="shell"],.fc-art[data-hot="neck"] [data-k="neck"]{display:inline}
@keyframes halo{50%{stroke-opacity:.45}}
@media (orientation:landscape) and (max-height:560px){
  .sheet .in{max-width:760px;padding:12px 14px}
  .fc-body{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center}
  .fc-art{aspect-ratio:auto;height:calc(100vh - 176px);max-height:210px;min-height:120px}
  .fc-head{font-size:1.08rem;margin-bottom:6px}
  .fc-name{font-size:1.08rem}
  .fc-text{font-size:.9rem}
  .sheet .btn{margin-top:10px;min-height:46px}
  .sheet .note{margin-top:6px}
}
.scrim{position:fixed;inset:0;background:rgba(5,16,11,.6);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:15}
.scrim.on{opacity:1;pointer-events:auto}

/* language switch */
.tb-right{display:flex;align-items:center;gap:6px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(0,0,0,.18);flex:none}
.lang button{background:none;border:0;color:var(--muted);font-size:.74rem;font-weight:800;letter-spacing:.06em;padding:6px 10px;min-width:40px;min-height:34px}
.lang button[aria-pressed="true"]{background:var(--orange);color:#1a1208}
.lang-inline{vertical-align:middle;margin-left:4px}
.lang-inline button{min-height:28px;padding:4px 9px;font-size:.68rem}
.legalbar a{color:var(--muted)}
.legalbar b{color:#cfe3d7}

/* result */
.result{display:grid;gap:14px;margin:auto 0;padding:6px 0;text-align:center}
.stars{display:flex;justify-content:center;gap:8px;margin:2px 0}
.stars svg{width:54px;height:54px}
.result h2{font-size:clamp(1.7rem,7vw,2.5rem);font-weight:900;line-height:1.05}
.big{font-size:3.3rem;font-weight:900;color:var(--yellow);line-height:1}
.big small{font-size:1rem;color:var(--muted);font-weight:700;display:block;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.recap{display:grid;gap:8px;text-align:left}
.recap .row{display:flex;gap:10px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:.92rem}
.recap .row b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;color:#fff;background:var(--green-d)}
.recap .row.no b{background:var(--red)}
.recap .row span{flex:1}
.recap .row small{color:var(--muted);display:block}
.full{text-align:left;background:linear-gradient(165deg,rgba(255,122,26,.18),rgba(255,255,255,.04));border:1px solid rgba(255,122,26,.45);border-radius:20px;padding:14px 16px}
.full h3{font-size:1rem;font-weight:900;margin-bottom:8px;color:#ffd9b8}
.full ul{margin:0;padding-left:1.1rem;line-height:1.55;font-size:.92rem;color:#e6efe9}
.qr{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:.84rem;color:#cfe3d7}
.qr div{flex:none;width:64px;height:64px;border:2px dashed rgba(255,255,255,.4);border-radius:10px;display:grid;place-items:center;font-size:.6rem;text-align:center;line-height:1.1;color:var(--muted)}
.cta{display:grid;gap:10px;grid-template-columns:1fr;margin-top:4px}
@media (min-width:560px){.cta{grid-template-columns:1fr 1fr}}

/* modal */
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;padding:12px}
.modal.on{display:flex}
@media (min-width:700px){.modal{align-items:center}}
.modal .box{position:relative;z-index:31;width:100%;max-width:620px;max-height:88vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:26px;padding:22px 20px 18px;
  box-shadow:0 30px 80px rgba(0,0,0,.5);animation:fadein .25s ease both}
.modal .back{position:absolute;inset:0;background:rgba(5,16,11,.65)}
.modal h2{font-size:1.45rem;font-weight:900;margin-bottom:4px;padding-right:48px}
.modal h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:#5d7467;margin:14px 0 6px}
.modal p,.modal li{color:var(--ink2);line-height:1.5;font-size:.95rem}
.modal ul{margin:0;padding-left:1.1rem}
.modal .x{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:12px;border:1px solid #d7e0d9;background:#fff;color:var(--ink);font-size:1.2rem}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchips span{background:#e3f0e8;color:#14412c;font-weight:700;font-size:.82rem;padding:6px 11px;border-radius:99px}
.soon{margin-top:14px;padding:10px 12px;border-radius:14px;background:#fff1e3;color:#7a3d06;font-size:.85rem;font-weight:700}
.small{font-size:.8rem !important;color:#5d7467 !important}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
.idle{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.6px)}}
.chain{animation:chain .5s linear infinite}
@keyframes chain{to{stroke-dashoffset:-6}}
.shield.hit .bar{animation:hitbar .6s ease}
@keyframes hitbar{30%{box-shadow:0 0 0 3px rgba(229,72,77,.95)}}

.pitch{max-width:34rem;margin:14px auto 0;font-size:.9rem;line-height:1.5;color:#cfe3d7}
.pitch a{color:var(--orange);font-weight:800}

</style>
</head>
<body>
<div id="app">

  <!-- START -->
  <section class="screen active" id="s-start" aria-labelledby="t-start">
    <header class="topbar">
      <span class="brand" data-th="brand"></span>
      <div class="tb-right">
        <div class="lang" role="group" data-ta="langGroup"><button type="button" data-setlang="de">DE</button><button type="button" data-setlang="en">EN</button></div>
        <button class="linkbtn" type="button" data-legal data-t="legalBtn"></button>
      </div>
    </header>
    <div class="hero">
      <p class="eyebrow" data-t="startEyebrow"></p>
      <h1 id="t-start" data-t="h1"></h1>
      <p class="lead" data-t="lead"></p>
      <ul class="chips"><li data-t="chip1"></li><li data-t="chip2"></li><li data-t="chip3"></li></ul>

function applyLang() {

document.addEventListener('keydown', e => {
  const open = $('#modal').classList.contains('on');
  if (open && e.key === 'Escape') { closeModal(); return; }
  if (open && e.key === 'Tab') {
    const f = $$('#modal button, #modal a[href]').filter(n => !n.disabled);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if ($('#sheet').classList.contains('on') && e.key === 'Tab') { e.preventDefault(); $('#sh-next').focus(); return; }
  if (!open && $('#s-play').classList.contains('active') && S && S.asking && /^[1-3]$/.test(e.key)) {
    const b = $$('#choices .choice')[Number(e.key) - 1]; if (b) b.click();
  }
});

    setOp(b, 0); xf(b, {});
  } else {
    flashFx('bad'); shake(); calloutFx(T('cOuch'), false); face(true);
    const st = g('#fx-stars');
    await tween(400, e => { setOp(st, e); xf(st, { r: 30 * e, px: 0, py: -160 }); }, E.out);
    await sleep(700);
    await tween(240, e => setOp(st, 1 - e), E.lin);
    setOp(st, 0); xf(st, {}); face(false);
  }
  calloutOff();
}

/* ---- hazards: warn (loops while player thinks) + resolve (plays after answer) ---- */
const HZ = {
  noise: {
    warn(ev) {
      const hz = g('#hz-noise'); setOp(hz, 1);
      const rings = $$('.nr', hz), ear = g('#n-ear');
      startWarn(t => {
        rings.forEach((r, i) => { const q = (((t * .85 - i * .33) % 1) + 1) % 1; r.setAttribute('r', (12 + q * 66).toFixed(1)); r.setAttribute('opacity', ((1 - q) * .9).toFixed(2)); });
        ear.setAttribute('opacity', (.45 + .55 * Math.abs(Math.sin(t * 6))).toFixed(2));
      });
      calloutFx(L(ev.callout), false);
    },
    async resolve(safe) {
      stopWarn(); calloutOff();
      const hz = g('#hz-noise'), rings = $$('.nr', hz), ear = g('#n-ear');
      await tween(900, (e, p) => {
        rings.forEach((r, i) => { const q = (((p * 2.6 - i * .3) % 1) + 1) % 1; r.setAttribute('r', (12 + q * 72).toFixed(1)); r.setAttribute('opacity', ((1 - q) * .95).toFixed(2)); });
        ear.setAttribute('opacity', safe ? (1 - p * .9).toFixed(2) : '1');
      }, E.lin);
      await outcomeFx(safe);
      setOp(hz, 0);
    }
  },
  chips: {
    warn(ev) {
      const grp = g('#hz-chips'); grp.innerHTML = '';
      const sparks = [];
      for (let i = 0; i < 6; i++) { const p = document.createElementNS(SVGNS, 'path'); p.setAttribute('d', 'M0 -4.6 L4.6 0 L0 4.6 L-4.2 1.6Z'); p.setAttribute('fill', i % 2 ? '#e0a45a' : '#f6d28b'); p.setAttribute('stroke', '#8a5a2b'); p.setAttribute('stroke-width', '.9'); grp.appendChild(p); sparks.push(p); }
      startWarn(t => {
        sparks.forEach((p, i) => { const q = (((t * .9 + i / 6) % 1) + 1) % 1; const x = 242 + 26 * q + Math.sin(i * 7) * 6, y = 220 - 54 * q * (1 - .45 * q) + Math.cos(i * 5) * 3;
          p.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(t * 300 + i * 60) % 360})`); p.setAttribute('opacity', (1 - q * .8).toFixed(2)); });
      });
      calloutFx(L(ev.callout), false);
    },
    async resolve(safe) {
      stopWarn(); calloutOff();
      const grp = g('#hz-chips'); grp.innerHTML = '';
      const chips = [];
      for (let i = 0; i < 14; i++) {
        const p = document.createElementNS(SVGNS, 'path'); p.setAttribute('d', 'M0 -5.2 L5.2 0 L0 5.2 L-4.8 1.8Z'); p.setAttribute('fill', i % 3 ? '#e0a45a' : '#f6d28b'); p.setAttribute('stroke', '#8a5a2b'); p.setAttribute('stroke-width', '.9'); grp.appendChild(p);
        const tx = 172 + rand(-3, 15), ty = 138 + rand(-6, 8);
        chips.push({ p, d: i * .035, p0: [238, 221], p1: [(238 + tx) / 2 + rand(-6, 14), Math.min(221, ty) - rand(24, 54)], p2: [tx, ty],
          rb: [tx + rand(26, 74), ty - rand(10, 46)], rot: rand(-720, 720) });
      }
      await tween(1150, (e, p) => {
        chips.forEach(c => {
          const q = clamp((p - c.d) / .62, 0, 1);
          if (q <= 0) { c.p.setAttribute('opacity', 0); return; }
          if (q < 1) { const a = E.out(q), x = (1 - a) * (1 - a) * c.p0[0] + 2 * (1 - a) * a * c.p1[0] + a * a * c.p2[0], y = (1 - a) * (1 - a) * c.p0[1] + 2 * (1 - a) * a * c.p1[1] + a * a * c.p2[1];
            c.p.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(c.rot * q).toFixed(0)})`); c.p.setAttribute('opacity', 1); }
          else { const r = clamp((p - c.d - .62) / .38, 0, 1);
            if (safe) { const x = c.p2[0] + (c.rb[0] - c.p2[0]) * E.out(r), y = c.p2[1] + (c.rb[1] - c.p2[1]) * E.out(r) + 40 * r * r;
              c.p.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(c.rot + 360 * r).toFixed(0)})`); c.p.setAttribute('opacity', (1 - r).toFixed(2)); }
            else { c.p.setAttribute('transform', `translate(${c.p2[0].toFixed(1)} ${c.p2[1].toFixed(1)}) scale(${(1 + r * 1.4).toFixed(2)})`); c.p.setAttribute('opacity', (1 - r).toFixed(2)); } }
        });
      }, E.lin);
      grp.innerHTML = '';
      await outcomeFx(safe);
    }
  },
  branch: {
    warn(ev) {
      const hz = g('#hz-branch'); setOp(hz, 1);
      startWarn(t => { const w = Math.sin(t * 5); xf(hz, { x: 288, y: 72 + w * .8, r: -12 + w * 2.6, px: 48, py: -9 }); });
      calloutFx(L(ev.callout), false);
    },
    async resolve(safe) {
      stopWarn(); calloutOff();
      const hz = g('#hz-branch'), helmet = g('#helmet'), worker = g('#worker');
      await tween(640, e => xf(hz, { x: 288 - 123 * e, y: 72 + 22 * e, r: -12 + 20 * e }), E.inn);
      if (safe) {
        flashFx('good');
        const rb = tween(1000, (e, p) => { const x = 165 - 78 * e; const y = 94 - 46 * Math.sin(Math.min(p / .45, 1) * Math.PI / 2) * (p < .45 ? 1 : 1 - (p - .45) / .55) + 150 * Math.max(0, p - .35) * Math.max(0, p - .35) * 3.2; xf(hz, { x, y: Math.min(y, 246), r: 8 + 130 * e }); }, E.lin);
        await tween(130, e => xf(helmet, { sy: 1 - .09 * e, sx: 1 + .03 * e, py: -131 }), E.out);
        await tween(260, e => xf(helmet, { sy: .91 + .09 * e, sx: 1.03 - .03 * e, py: -131 }), E.back);
        xf(helmet, {}); await rb;
      } else {
        const sq = tween(170, e => xf(worker, { x: W.x, y: W.y, sy: 1 - .13 * e }), E.out);
        await sq;
        const back = tween(380, e => xf(worker, { x: W.x, y: W.y, sy: .87 + .13 * e }), E.back);
        const slide = tween(520, e => xf(hz, { x: 165 + 52 * e, y: 94 + 150 * e * e, r: 8 + 6 * e }), E.inn);
        await Promise.all([back, slide]);
        xf(worker, { x: W.x, y: W.y });
      }
      await outcomeFx(safe);
      setOp(hz, 0);
    }
  },
  snag: {
    warn(ev) {
      const hz = g('#hz-snag'), br = g('#sn-branch'); setOp(hz, 1);
      startWarn(t => xf(br, { r: Math.sin(t * 2.6) * 1.8, px: 62, py: 140 }));
      calloutFx(L(ev.callout), false);
    },
    async resolve(safe) {
      stopWarn(); calloutOff();
      const hz = g('#hz-snag'), br = g('#sn-branch'), helmet = g('#helmet'), worker = g('#worker');
      await tween(720, (e, p) => { xf(worker, { x: W.x - 36 * e, y: W.y - Math.abs(Math.sin(p * 9)) * 2.4, r: -2 * e }); }, E.io);
      if (safe) {
        flashFx('good');
        const lf = [];
        for (let i = 0; i < 7; i++) { const l = document.createElementNS(SVGNS, 'ellipse'); l.setAttribute('rx', 5); l.setAttribute('ry', 2.8); l.setAttribute('fill', i % 2 ? '#3f9a56' : '#62bf74'); g('#hz-fx').appendChild(l); lf.push({ l, a: rand(-160, -20), v: rand(24, 60) }); }
        await tween(620, (e, p) => {
          xf(br, { r: -9 * Math.sin(p * Math.PI), px: 62, py: 140 });
          xf(worker, { x: W.x - 36 + 36 * e, y: W.y, r: -2 + 2 * e });
          lf.forEach(o => { const a = o.a * Math.PI / 180; o.l.setAttribute('transform', `translate(${(128 + Math.cos(a) * o.v * e).toFixed(1)} ${(134 + Math.sin(a) * o.v * e + 30 * e * e).toFixed(1)}) rotate(${(e * 300).toFixed(0)})`); o.l.setAttribute('opacity', (1 - e).toFixed(2)); });
        }, E.out);
        g('#hz-fx').innerHTML = '';
      } else {
        const a = tween(180, e => { xf(helmet, { x: 12 * e, y: -4 * e, r: -26 * e, px: 0, py: -140 }); xf(worker, { x: W.x - 36 + 14 * e, y: W.y, r: -8 * e }); }, E.out);
        await a;
        const b = tween(640, e => { xf(helmet, { x: 12 * (1 - e), y: -4 * (1 - e), r: -26 * (1 - e), px: 0, py: -140 }); xf(worker, { x: W.x - 22 + 22 * e, y: W.y, r: -8 * (1 - e) }); }, E.back);
        await b;
      }
      xf(worker, { x: W.x, y: W.y }); xf(helmet, {});
      await outcomeFx(safe);
      setOp(hz, 0); xf(br, {});
    }
  },
  slip: {
    warn(ev) {
      const hz = g('#hz-slip'), lg = g('#slip-log'); setOp(hz, 1);
      startWarn(t => { setOp(hz, .7 + .3 * Math.abs(Math.sin(t * 4))); xf(lg, { x: Math.sin(t * 3.2) * 1.4 }); });
      calloutFx(L(ev.callout), false);
    },
    async resolve(safe) {
      stopWarn(); calloutOff();
      const hz = g('#hz-slip'), lg = g('#slip-log'), worker = g('#worker');
      setOp(hz, 1); xf(lg, {});
      // step onto the wet branch
      await tween(480, (e, p) => xf(worker, { x: W.x + 16 * e, y: W.y - Math.abs(Math.sin(p * 6.5)) * 2.2 }), E.io);
      // the branch rolls away and the worker falls backwards (the back of the head hits first)
      const roll = tween(760, e => xf(lg, { x: 30 * e }), E.out);
      await tween(460, e => xf(worker, { x: W.x + 16 + 12 * e, y: W.y, r: -64 * e }), E.inn);
      await outcomeFx(safe);
      await roll;
      await tween(620, e => xf(worker, { x: W.x + 28 - 28 * e, y: W.y, r: -64 * (1 - e) }), E.out);
      xf(worker, { x: W.x, y: W.y });
      setOp(hz, 0); xf(lg, {});
    }
  }
};

/* ============ tray ============ */
function renderTray() {
  $('#tray').innerHTML = SLOT_ORDER.map(k => `<div class="slot" data-f="${k}"><span class="ico">${IC[FEAT[k].icon]}</span><small>${esc(L(FEAT[k].short))}</small></div>`).join('');
}
function paintTray() {
  if (!S) return;
  S.results.forEach(r => { const el = $(`.slot[data-f="${r.ev.answer}"]`); if (el) el.classList.add(r.ok ? 'on' : 'miss'); });
}

/* ============ timer ============ */
function stopTimer() { if (timer) { timer.cancel = true; cancelAnimationFrame(timer.raf); clearTimeout(timer.id); timer = null; } }
function startTimer(ms, onEnd) {
  stopTimer();
  const el = $('#timer-fill'); el.style.transform = 'scaleX(1)'; el.style.background = 'var(--yellow)';
  const my = epoch; const t0 = performance.now(); const t = { cancel: false };
  timer = t;
  if (RM) { t.id = setTimeout(() => { if (!t.cancel && my === epoch) onEnd(); }, ms); return; }
  const tick = now => {
    if (t.cancel || my !== epoch) return;
    const p = clamp((now - t0) / ms, 0, 1);
    el.style.transform = `scaleX(${(1 - p).toFixed(3)})`;
    el.style.background = p > .75 ? '#ff6b6b' : (p > .5 ? '#ffb23d' : 'var(--yellow)');
    if (p >= 1) { timer = null; onEnd(); return; }
    t.raf = requestAnimationFrame(tick);
  };
  t.raf = requestAnimationFrame(tick);
}

/* ============ game flow ============ */
function openIntro() {
  epoch++; S = null; stopTimer();
  mountScene($('#intro-art')); resetScene(true);
  go('intro');
}
function startGame() {
  epoch++; stopTimer(); hideSheet();
  S = { i: 0, results: [], wrong: 0, asking: false, last: null };
  renderTray();
  mountScene($('#stage')); resetScene(true);
  $('#shield-fill').style.width = '0%';
  go('play');
  nextEvent();
}
function renderEventTexts() {
  const ev = EVENTS[S.i];
  $('#hud-step').textContent = T('step').replace('{i}', S.i + 1).replace('{n}', EVENTS.length);
  $('#hz-tag').textContent = L(ev.tag);
  $('#hz-title').textContent = L(ev.title);
  $('#hz-text').textContent = L(ev.text);
  $$('#choices .choice').forEach(b => { const s = $('.cl', b); if (s) s.textContent = L(FEAT[b.dataset.f].btn); });
}
function nextEvent() {
  const my = epoch; busy = false;
  const ev = EVENTS[S.i];
  const equipped = new Set(S.results.filter(r => r.ok).map(r => r.ev.answer));
  const decoys = shuffle(ev.decoys.filter(d => !equipped.has(d))).slice(0, 2);
  const opts = shuffle([ev.answer, ...decoys]);
  const box = $('#choices'); box.innerHTML = '';
  opts.forEach(k => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'choice'; b.dataset.f = k;
    b.innerHTML = `<span class="ci">${IC[FEAT[k].icon]}</span><span class="cl"></span>`;
    b.addEventListener('click', () => choose(k));
    box.appendChild(b);
  });
  renderEventTexts();
  resetScene(false);
  HZ[ev.key].warn(ev);
  S.asking = true; S.t0 = performance.now();
  startTimer(LIMIT, () => { if (my === epoch) choose(null); });
}
async function choose(k) {
  if (!S || !S.asking || busy) return;
  busy = true; S.asking = false; stopTimer();
  const my = epoch;
  const ev = EVENTS[S.i];
  const ok = k === ev.answer;
  $$('#choices .choice').forEach(b => {
    b.disabled = true;
    if (b.dataset.f === ev.answer) b.classList.add('right');
    else if (b.dataset.f === k) b.classList.add('wrong');
  });
  S.results.push({ ev, ok, picked: k, slow: k === null });
  if (ok) {
    await Promise.all([HZ[ev.key].resolve(true), (async () => { await sleep(380); await equip(ev.answer); setShield(); })()]);
  } else {
    S.wrong++;
    const sh = $('.shield'); sh.classList.remove('hit'); void sh.offsetWidth; sh.classList.add('hit');
    await HZ[ev.key].resolve(false);
    const sl = $(`.slot[data-f="${ev.answer}"]`); if (sl) sl.classList.add('miss');
  }
  if (my !== epoch) return;
  showSheet(ev, ok, k === null);
}
function setShield() { if (!S) return; $('#shield-fill').style.width = (S.results.filter(r => r.ok).length * 20) + '%'; }

/* ---- feature pop-up: shows the helmet feature that protects against this hazard ---- */
function fillSheet(r) {
  const ev = r.ev, f = FEAT[ev.answer];
  $('#sheet').classList.toggle('bad', !r.ok);
  $('#sh-mark').textContent = r.ok ? '✓' : '✕';
  $('#sh-title').textContent = r.ok ? L(ev.okT) : (r.slow ? T('slowT') : L(ev.noT));
  $('#sh-eyebrow').textContent = r.ok ? T('eyeOk') : T('eyeNo');
  $('#sh-feat').textContent = L(f.name);
  $('#sh-text').textContent = (!r.ok && r.slow ? T('slowX') : '') + L(f.info);
  const more = $('#sh-extra');
  if (f.more) { more.textContent = L(f.more); more.hidden = false; } else { more.textContent = ''; more.hidden = true; }
  $('#sh-art').setAttribute('data-hot', ev.answer);
  $('#sh-next').textContent = S && S.i === EVENTS.length - 1 ? T('toResult') : T('next');
  $('#sh-note').textContent = T('shNote');
}
function showSheet(ev, ok, slow) {
  S.last = { ev, ok, slow };
  fillSheet(S.last);
  const inner = $('#sheet .in'); if (inner) inner.scrollTop = 0;
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
  setTimeout(() => { try { $('#sh-next').focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 380);
}
function hideSheet() { $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
function afterSheet() {
  hideSheet();
  if (!S) return;
  if (S.i < EVENTS.length - 1) { S.i++; nextEvent(); } else finish();
}

/* ============ result ============ */
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z" fill="FILL" stroke="STROKE" stroke-width="1.2" stroke-linejoin="round"/></svg>';
function renderResult() {
  const c = S.results.filter(r => r.ok).length;
  const stars = c === 5 ? 3 : c >= 3 ? 2 : c >= 1 ? 1 : 0;
  $('#stars').innerHTML = [0, 1, 2].map(i => STAR.replace('FILL', i < stars ? '#ffc83d' : 'rgba(255,255,255,.08)').replace('STROKE', i < stars ? '#e09500' : 'rgba(255,255,255,.3)')).join('');
  $('#res-pct').textContent = (c * 20) + ' %';
  $('#res-text').textContent = T(c === 5 ? 'res3' : c >= 3 ? 'res2' : c >= 1 ? 'res1' : 'res0');
  $('#recap').innerHTML = S.results.map(r => {
    const name = L(FEAT[r.ev.answer].name);
    return `<div class="row ${r.ok ? '' : 'no'}"><b>${r.ok ? '✓' : '✕'}</b><span>${esc(L(r.ev.title).replace(/[!:]/g, ''))}<small>${esc(r.ok ? name : T('correctWas') + name)}</small></span></div>`;
  }).join('');
}
function finish() {
  epoch++; stopTimer(); stopWarn();
  renderResult();
  go('result');
}

/* ============ boot ============ */
function init() {
  sceneEl = $('#tpl-scene').content.querySelector('svg').cloneNode(true);
  mountScene($('#intro-art'));
  applyLang();
  resetScene(true);
  $('#intro-back').addEventListener('click', () => { epoch++; go('start'); });
  $('#btn-start').addEventListener('click', startGame);
  $('#play-exit').addEventListener('click', () => { epoch++; stopTimer(); stopWarn(); hideSheet(); S = null; go('start'); });
  $('#sh-next').addEventListener('click', afterSheet);
  $('#res-again').addEventListener('click', startGame);
  $('#res-jobs').addEventListener('click', () => { epoch++; go('start'); });
}
init();
})();
